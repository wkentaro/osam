[build-system]
requires = ["hatchling>=1.20.0", "hatch-vcs", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[project.urls]
Homepage = "https://github.com/wkentaro/osam"

[project]
name = "osam"
description = "Run promptable vision models locally, on CPU, CUDA, WebGPU or CoreML."
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Kentaro Wada", email = "www.kentaro.wada@gmail.com" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "click",
  # osam.Client runs its own server. 0.100 is the first with pydantic 2.
  "fastapi>=0.100",
  "gdown>=6.4.0",
  "imgviz>=2.0.0",
  "loguru",
  "numpy",
  # PIL.Image.Resampling
  "Pillow>=9.1",
  "pydantic>=2.1",
  "typing-extensions>=4.4",
  "uvicorn",
]
dynamic = ["readme", "version"]

[project.optional-dependencies]
# onnxruntime and onnxruntime-gpu install into the same package directory, so
# osam leaves the choice of build to the user.
cpu = [
  "onnxruntime>=1.23.2",
  # onnxruntime dropped cp310 wheels at 1.24, which is also the first release
  # with cp314 wheels; pin 3.10 below that boundary.
  "onnxruntime<1.24; python_version < '3.11'",
  # Rewrites SAM3's Gemm weights for CoreML.
  "onnx>=1.17.0; sys_platform == 'darwin'",
  # SAM3 runs its image encoder on CoreML and the rest on WebGPU, 4 times as
  # fast as the rest on CPU. The pins are those of webgpu below, whose
  # onnxruntime ships only for Apple silicon on macOS 14 (Darwin 23) or later.
  # Not "osam[webgpu]; <marker>", which the wheel flattens without the marker.
  "onnxruntime>=1.27,<1.31; sys_platform == 'darwin' and platform_machine == 'arm64' and platform_release >= '23' and python_version >= '3.11'",
  "onnxruntime-ep-webgpu>=0.5; sys_platform == 'darwin' and platform_machine == 'arm64' and platform_release >= '23' and python_version >= '3.11'",
]
gpu = [
  # 1.23.2 runs SAM3 wrong on CUDA (#43), so SAM3 runs on CPU on Python 3.10.
  "onnxruntime-gpu[cuda,cudnn]>=1.24.1; python_version >= '3.11'",
  "onnxruntime-gpu[cuda,cudnn]>=1.23.2,<1.24; python_version < '3.11'",
]
# The WebGPU plugin runs on Vulkan, Direct3D 12 or Metal and installs next to
# the CPU build instead of replacing it.
webgpu = [
  # onnxruntime-ep-webgpu 0.5 fails to create kernels on onnxruntime 1.26, and
  # EfficientSAM's decoder fails on WebGPU from onnxruntime 1.31.
  "onnxruntime>=1.27,<1.31; python_version >= '3.11'",
  "onnxruntime-ep-webgpu>=0.5; python_version >= '3.11'",
  "onnx>=1.17.0; sys_platform == 'darwin' and python_version >= '3.11'",
]

[tool.uv]
default-groups = ["cpu", "dev"]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "gpu" },
  ],
  [
    { extra = "gpu" },
    { extra = "webgpu" },
  ],
  [
    { extra = "gpu" },
    { group = "cpu" },
  ],
]

[dependency-groups]
# A group of its own, so that `uv run --no-group cpu --extra gpu` keeps dev.
cpu = ["osam[cpu]"]
dev = [
  "httpx>=0.27",
  "pytest-xdist>=3.6.1",
  "pytest>=8.3.4",
  "gruff==0.2.5",
  "ruff==0.17.4",
  "onnx>=1.17.0",
  "ty>=0.0.11",
  "ipython>=8.38.0",
  "taplo>=0.9.3",
  "mdformat>=1.0.0",
  "yamlfix>=1.19.1",
  "typos>=1.45.1",
  "pytest-cov>=7.1.0",
  "towncrier>=24.8",
]

[tool.gruff.lint]
select = ["GR:baseline", "GR:opinionated"]
# GR013 enforces the stricter form of GR001.
ignore = ["GR001"]
# Vendored code, kept close to its source so the two diff.
per-file-ignores = { "osam/_models/_clip/**" = [
  "GR",
], "osam/_models/sam3/_tracker.py" = [
  "GR",
], "osam/_models/sam3/_video.py" = [
  "GR",
] }

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{ path = "README.md" }]

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'src="(?!https?://)([^"]+)"'
replacement = 'src="https://raw.githubusercontent.com/wkentaro/osam/main/\1"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '!\[([^\]]*)\]\((?!https?://)([^)]+)\)'
replacement = '![\1](https://raw.githubusercontent.com/wkentaro/osam/main/\2)'

[tool.hatch.version]
source = "vcs"

[project.scripts]
osam = "osam:__main__.cli"

[tool.towncrier]
directory = "changelog.d"
filename = "CHANGELOG.md"
title_format = "## {version} - {project_date}"
issue_format = "[#{issue}](https://github.com/wkentaro/osam/pull/{issue})"
ignore = ["README.md"]
type = [
  { directory = "added", name = "Added", showcontent = true },
  { directory = "changed", name = "Changed", showcontent = true },
  { directory = "deprecated", name = "Deprecated", showcontent = true },
  { directory = "removed", name = "Removed", showcontent = true },
  { directory = "fixed", name = "Fixed", showcontent = true },
  { directory = "security", name = "Security", showcontent = true },
]

[tool.ruff.lint]
# Pyflakes (`F`), pycodestyle (`E`), isort (`I`), pyupgrade (`UP`).
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
force-single-line = true

# Names from SAM3's source, which the vendored video code keeps.
[tool.typos.default.extend-words]
tpos = "tpos"

[tool.typos.default.extend-identifiers]
_propogate_tracker_one_frame_local_gpu = "_propogate_tracker_one_frame_local_gpu"
